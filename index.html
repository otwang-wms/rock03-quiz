<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>岩石與礦物搶答大對決</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 避免平板點擊時出現延遲、反白或縮放 */
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D 卡片翻轉效果 */
        .card-container {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.12);
        }
        .card-front {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            border: 4px solid #eab308;
        }
        .card-back {
            background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%);
            border: 4px solid #3b82f6;
            transform: rotateY(180deg);
        }

        /* 滿版豪華證書設計 */
        .certificate-bg {
            background-color: #ffffff;
            border: 12px solid #d4af37;
            outline: 3px solid #856d22;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.08), 0 10px 25px rgba(0,0,0,0.3);
            background-image: radial-gradient(#fef08a 1px, transparent 1px);
            background-size: 24px 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-gray-800">
    <div id="root" class="w-full h-[100dvh]"></div>

    <script type="text/babel">
        const { useState } = React;

        const rockData = [
            {"編號": 1, "名稱": "石灰岩", "特色": "主要是由方解石所組成的"},
            {"編號": 2, "名稱": "石灰岩", "特色": "是製作水泥的主要材料"},
            {"編號": 3, "名稱": "花崗岩", "特色": "硬度比較高（約 7 級），可做成建築的材料，例如：牆壁、地板"},
            {"編號": 4, "名稱": "花崗岩", "特色": "由長石、黑雲母或白雲母、石英等礦物所組成的"},
            {"編號": 5, "名稱": "石墨", "特色": "顏色比較黑，硬度小，可導電"},
            {"編號": 6, "名稱": "石墨", "特色": "可以作為鉛筆筆心的原料"},
            {"編號": 7, "名稱": "石英", "特色": "若有良好的結晶型態，可以稱為水晶，可以加工成為飾品"},
            {"編號": 8, "名稱": "石英", "特色": "硬度 7 級，抗磨損能力高，可以做成地磚"},
            {"編號": 9, "名稱": "板岩", "特色": "容易堆疊且質地堅硬，原住民族常拿來當建築石板屋的材料"},
            {"編號": 10, "名稱": "板岩", "特色": "質地堅硬且具有極易剝離成平整薄板的特性"},
            {"編號": 11, "名稱": "硫磺", "特色": "鮮黃色或淡黃色晶體/粉末，具特殊刺鼻氣味"},
            {"編號": 12, "名稱": "硫磺", "特色": "容易燃燒，因此是製作火藥的原料"},
            {"編號": 13, "名稱": "滑石", "特色": "白色、灰白色或淺綠色，具珍珠光澤"},
            {"編號": 14, "名稱": "滑石", "特色": "硬度 1 級 (最軟標準礦物)，摸起來具滑膩感"},
            {"編號": 15, "名稱": "方解石", "特色": "石灰岩中乳白色顆粒狀的礦物"},
            {"編號": 16, "名稱": "方解石", "特色": "無色透明或乳白色，常見菱面體結晶，硬度 3 級"},
            {"編號": 17, "名稱": "金剛石(鑽石)", "特色": "無色透明或彩鑽，珍貴「珠寶飾品」"},
            {"編號": 18, "名稱": "金剛石(鑽石)", "特色": "硬度 10 級(自然界最硬標準礦物)"}
        ];

        const App = () => {
            const [screen, setScreen] = useState("login");
            const [p1Name, setP1Name] = useState("");
            const [p2Name, setP2Name] = useState("");
            const [p1Score, setP1Score] = useState(0);
            const [p2Score, setP2Score] = useState(0);
            
            const [currentCard, setCurrentCard] = useState(null);
            const [isFlipped, setIsFlipped] = useState(false);
            const [buzzerLocked, setBuzzerLocked] = useState(false);
            const [answeringPlayer, setAnsweringPlayer] = useState(null);
            const [showAddPoint, setShowAddPoint] = useState(false);
            const [showNextBtn, setShowNextBtn] = useState(false);
            const [pointAdded, setPointAdded] = useState(false);

            const getRandomCard = (excludeId) => {
                const availableCards = rockData.filter(c => c.編號 !== excludeId);
                const randomIndex = Math.floor(Math.random() * availableCards.length);
                return availableCards[randomIndex];
            };

            const startGame = () => {
                if (!p1Name.trim() || !p2Name.trim()) {
                    alert("請在左邊和右邊輸入 1P 與 2P 的名稱或暱稱喔！");
                    return;
                }
                setCurrentCard(getRandomCard(null));
                setScreen("game");
            };

            const handleBuzzer = (player) => {
                if (buzzerLocked) return;
                setBuzzerLocked(true);
                setAnsweringPlayer(player);
                setTimeout(() => {
                    setShowAddPoint(true);
                    setShowNextBtn(true);
                }, 1000);
            };

            const handleAddPoint = (player) => {
                if (pointAdded) return;
                let newP1 = p1Score;
                let newP2 = p2Score;
                
                if (player === '1P') {
                    newP1 += 1;
                    setP1Score(newP1);
                } else {
                    newP2 += 1;
                    setP2Score(newP2);
                }
                setPointAdded(true);
                setShowAddPoint(false);

                if (newP1 >= 9 || newP2 >= 9) {
                    setTimeout(() => setScreen("result"), 600);
                }
            };

            const handleNextQuestion = () => {
                setCurrentCard(getRandomCard(currentCard.編號));
                setIsFlipped(false);
                setBuzzerLocked(false);
                setAnsweringPlayer(null);
                setShowAddPoint(false);
                setShowNextBtn(false);
                setPointAdded(false);
            };

            const resetGame = () => {
                setP1Score(0);
                setP2Score(0);
                setScreen("login");
            };

            const getPraiseText = () => {
                const diff = Math.abs(p1Score - p2Score);
                if (diff >= 7) return "太厲害了！以壓倒性的實力獲勝，簡直是無可匹敵的岩石礦物學大師！";
                if (diff >= 4) return "表現非常傑出！對岩石與礦物的特性瞭若指掌，實力強勁！";
                if (diff >= 2) return "精彩絕倫的對抗賽！憑藉敏銳的判斷與速度贏得勝利！";
                return "勢均力敵的巔峰之戰！微幅差距險勝，兩位同學表現都非常棒！";
            };

            // ========== 首頁登入 ==========
            if (screen === "login") {
                return (
                    <div className="w-full h-[100dvh] flex items-center justify-center p-4 bg-gradient-to-br from-emerald-100 via-teal-50 to-sky-100 overflow-y-auto">
                        <div className="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl p-5 sm:p-8 max-w-3xl w-full my-auto border-2 border-emerald-200">
                            <h1 className="text-2xl sm:text-4xl font-black text-emerald-800 text-center mb-4 tracking-wide">
                                🪨 岩石礦物搶答大對決 💎
                            </h1>
                            
                            <div className="bg-amber-50 border-l-4 border-amber-400 p-3 sm:p-4 mb-6 rounded-r-xl">
                                <h3 className="text-base sm:text-lg font-bold text-amber-900 mb-1 flex items-center">
                                    <span className="mr-1">📜</span> 遊戲說明
                                </h3>
                                <p className="text-xs sm:text-sm text-gray-700 leading-relaxed font-medium">
                                    這個遊戲是由2人進行搶答對決，遊戲進行時，畫面中的卡片會隨機出現岩石或礦物的特色描述，2人點擊各自的按鈕來進行搶答，答案是否正確，可以翻轉卡片查詢答案，由2人自行確認是否得分。<br/>
                                    <span className="text-red-600 font-bold">★ 先達到 9 分的選手即獲勝！</span>
                                </p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                <div className="bg-blue-50 p-4 rounded-xl border-2 border-blue-200 text-center">
                                    <label className="block text-lg font-black text-blue-700 mb-2">1P 選手</label>
                                    <input 
                                        type="text" 
                                        value={p1Name} 
                                        onChange={e => setP1Name(e.target.value)} 
                                        placeholder="輸入 1P 名稱或暱稱"
                                        className="w-full text-center text-base sm:text-lg p-2.5 border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500 font-bold"
                                    />
                                </div>
                                <div className="bg-red-50 p-4 rounded-xl border-2 border-red-200 text-center">
                                    <label className="block text-lg font-black text-red-700 mb-2">2P 選手</label>
                                    <input 
                                        type="text" 
                                        value={p2Name} 
                                        onChange={e => setP2Name(e.target.value)} 
                                        placeholder="輸入 2P 名稱或暱稱"
                                        className="w-full text-center text-base sm:text-lg p-2.5 border-2 border-red-300 rounded-lg focus:outline-none focus:border-red-500 font-bold"
                                    />
                                </div>
                            </div>

                            <div className="text-center">
                                <button 
                                    onClick={startGame}
                                    className="w-full sm:w-auto min-w-[200px] bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xl sm:text-2xl font-black py-3.5 px-10 rounded-full shadow-lg transition-all"
                                >
                                    開始對決 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== 遊戲主畫面 ==========
            if (screen === "game") {
                return (
                    <div className="w-full h-[100dvh] max-w-5xl mx-auto flex flex-col justify-between p-2.5 sm:p-4 overflow-hidden box-border">
                        
                        {/* 1. 頂部記分板 (shrink-0，高約 75px-90px) */}
                        <div className="shrink-0 flex items-center justify-between bg-white/90 backdrop-blur rounded-2xl shadow-sm border border-slate-200 px-3 py-2 sm:px-6">
                            {/* 1P 狀態 */}
                            <div className="flex items-center space-x-2 sm:space-x-4">
                                <div className="text-left">
                                    <div className="text-xs sm:text-sm font-bold text-blue-600 truncate max-w-[90px] sm:max-w-[140px]">
                                        1P: {p1Name}
                                    </div>
                                    <div className="text-3xl sm:text-4xl font-black text-blue-600 leading-none">
                                        {p1Score}
                                    </div>
                                </div>
                                {showAddPoint && answeringPlayer === '1P' && !pointAdded && (
                                    <button 
                                        onClick={() => handleAddPoint('1P')} 
                                        className="fade-in bg-green-500 hover:bg-green-600 active:scale-90 text-white text-xs sm:text-sm font-black py-1.5 px-3 rounded-full shadow animate-pulse"
                                    >
                                        +1 加分
                                    </button>
                                )}
                            </div>

                            {/* 中間標題與目標 */}
                            <div className="text-center px-2">
                                <span className="bg-slate-200 text-slate-700 text-[11px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full">
                                    目標 9 分獲勝
                                </span>
                            </div>

                            {/* 2P 狀態 */}
                            <div className="flex items-center space-x-2 sm:space-x-4">
                                {showAddPoint && answeringPlayer === '2P' && !pointAdded && (
                                    <button 
                                        onClick={() => handleAddPoint('2P')} 
                                        className="fade-in bg-green-500 hover:bg-green-600 active:scale-90 text-white text-xs sm:text-sm font-black py-1.5 px-3 rounded-full shadow animate-pulse"
                                    >
                                        +1 加分
                                    </button>
                                )}
                                <div className="text-right">
                                    <div className="text-xs sm:text-sm font-bold text-red-600 truncate max-w-[90px] sm:max-w-[140px]">
                                        2P: {p2Name}
                                    </div>
                                    <div className="text-3xl sm:text-4xl font-black text-red-600 leading-none">
                                        {p2Score}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 2. 中間卡片與翻牌區 (flex-1 min-h-0，高度自適應，不擠壓上下元件) */}
                        <div className="flex-1 min-h-0 flex flex-col items-center justify-center py-2 sm:py-3">
                            <div 
                                className={`card-container w-full max-w-xl h-[42vh] max-h-[260px] min-h-[170px] cursor-pointer ${isFlipped ? 'flipped' : ''}`}
                                onClick={() => setIsFlipped(!isFlipped)}
                            >
                                <div className="card-inner">
                                    {/* 正面：特色 */}
                                    <div className="card-face card-front">
                                        <div className="bg-amber-100 text-amber-800 text-xs sm:text-sm font-bold px-3 py-0.5 rounded-full mb-2 border border-amber-300">
                                            特色描述
                                        </div>
                                        <p className="text-base sm:text-2xl md:text-3xl font-bold text-gray-800 text-center leading-relaxed">
                                            {currentCard?.特色}
                                        </p>
                                    </div>
                                    {/* 背面：名稱 */}
                                    <div className="card-face card-back">
                                        <div className="bg-blue-100 text-blue-800 text-xs sm:text-sm font-bold px-3 py-0.5 rounded-full mb-2 border border-blue-300">
                                            答案解答
                                        </div>
                                        <p className="text-3xl sm:text-5xl md:text-6xl font-black text-blue-900 tracking-wider text-center">
                                            {currentCard?.名稱}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <button 
                                onClick={() => setIsFlipped(!isFlipped)} 
                                className="mt-2.5 sm:mt-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-1.5 sm:py-2 px-6 rounded-full shadow text-sm sm:text-base flex items-center gap-1.5 transition-transform"
                            >
                                <span>🔄</span> 翻轉看答案
                            </button>
                        </div>

                        {/* 3. 底部搶答大按鈕與下一題 (shrink-0，高約 130px-160px，固定可視範圍內) */}
                        <div className="shrink-0 flex items-center justify-between pb-1 sm:pb-3 px-2 sm:px-8">
                            
                            {/* 1P 搶答按鈕 */}
                            <div className="flex flex-col items-center">
                                <div className="h-6 sm:h-7 mb-1 flex items-center justify-center">
                                    {answeringPlayer === '1P' && (
                                        <span className="text-xs sm:text-base font-black text-blue-600 fade-in animate-bounce">
                                            1P 作答
                                        </span>
                                    )}
                                </div>
                                <button 
                                    disabled={buzzerLocked}
                                    onClick={() => handleBuzzer('1P')}
                                    className={`w-24 h-24 sm:w-32 sm:h-32 rounded-full font-black text-xl sm:text-3xl transition-transform active:scale-90 flex flex-col items-center justify-center shadow-lg ${
                                        buzzerLocked 
                                        ? 'bg-slate-300 text-slate-400 opacity-50 cursor-not-allowed border-4 border-slate-300' 
                                        : 'bg-blue-600 text-white hover:bg-blue-500 border-4 border-blue-400 shadow-blue-300'
                                    }`}
                                >
                                    <span>1P</span>
                                    <span className="text-xs sm:text-sm font-medium">搶答</span>
                                </button>
                            </div>

                            {/* 下一題按鈕 */}
                            <div className="flex flex-col items-center justify-center px-2">
                                {showNextBtn ? (
                                    <button 
                                        onClick={handleNextQuestion} 
                                        className="fade-in bg-purple-600 hover:bg-purple-500 active:scale-95 text-white text-base sm:text-xl font-black py-2.5 sm:py-3 px-5 sm:px-8 rounded-xl shadow-lg border-2 border-purple-400"
                                    >
                                        下一題 ➔
                                    </button>
                                ) : (
                                    <div className="text-xs sm:text-sm text-slate-400 font-bold">
                                        請點擊按鈕搶答
                                    </div>
                                )}
                            </div>

                            {/* 2P 搶答按鈕 */}
                            <div className="flex flex-col items-center">
                                <div className="h-6 sm:h-7 mb-1 flex items-center justify-center">
                                    {answeringPlayer === '2P' && (
                                        <span className="text-xs sm:text-base font-black text-red-600 fade-in animate-bounce">
                                            2P 作答
                                        </span>
                                    )}
                                </div>
                                <button 
                                    disabled={buzzerLocked}
                                    onClick={() => handleBuzzer('2P')}
                                    className={`w-24 h-24 sm:w-32 sm:h-32 rounded-full font-black text-xl sm:text-3xl transition-transform active:scale-90 flex flex-col items-center justify-center shadow-lg ${
                                        buzzerLocked 
                                        ? 'bg-slate-300 text-slate-400 opacity-50 cursor-not-allowed border-4 border-slate-300' 
                                        : 'bg-red-600 text-white hover:bg-red-500 border-4 border-red-400 shadow-red-300'
                                    }`}
                                >
                                    <span>2P</span>
                                    <span className="text-xs sm:text-sm font-medium">搶答</span>
                                </button>
                            </div>
                        </div>

                    </div>
                );
            }

            // ========== 結算頒獎證書 ==========
            if (screen === "result") {
                const winnerName = p1Score >= 9 ? p1Name : p2Name;
                return (
                    <div className="w-full h-[100dvh] flex items-center justify-center p-4 bg-slate-900 overflow-y-auto">
                        <div className="certificate-bg w-full max-w-2xl max-h-[92dvh] overflow-y-auto rounded-xl p-6 sm:p-10 flex flex-col items-center text-center my-auto">
                            <h1 className="text-3xl sm:text-5xl font-black text-amber-700 mb-2">🏆 恭喜獲勝 🏆</h1>
                            <p className="text-xs sm:text-sm text-gray-500 font-bold mb-3 tracking-widest uppercase">Certificate of Excellence</p>
                            
                            <h2 className="text-3xl sm:text-5xl font-black text-slate-800 mb-4 border-b-2 border-amber-500 pb-2 px-6">
                                {winnerName}
                            </h2>
                            
                            <p className="text-sm sm:text-lg text-slate-700 font-bold leading-relaxed mb-6 px-4">
                                {getPraiseText()}
                            </p>
                            
                            <div className="bg-amber-50/70 border border-amber-200 rounded-xl px-6 py-3 mb-6 w-full max-w-sm">
                                <div className="text-xs text-gray-500 font-bold mb-1">比賽最終比數</div>
                                <div className="flex items-center justify-around font-black">
                                    <div>
                                        <div className="text-xs text-blue-600 truncate max-w-[80px]">{p1Name}</div>
                                        <div className="text-2xl text-blue-600">{p1Score}</div>
                                    </div>
                                    <div className="text-xl text-slate-300">:</div>
                                    <div>
                                        <div className="text-xs text-red-600 truncate max-w-[80px]">{p2Name}</div>
                                        <div className="text-2xl text-red-600">{p2Score}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <button 
                                onClick={resetGame} 
                                className="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold py-2.5 px-8 rounded-full text-base sm:text-lg shadow-md transition-all"
                            >
                                再玩一次 🔄
                            </button>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
